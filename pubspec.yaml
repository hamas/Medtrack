name: medtrack
description: "A professional medical-grade medicine tracking application built with 100% pure Dart and Clean Architecture."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  confetti: ^0.8.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_heatmap_calendar: ^1.0.1
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  go_router: ^18.1.3
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  http: ^1.3.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  local_auth: ^3.0.1
  local_auth_android: ^2.3.0
  material_symbols_icons: ^4.2928.1
  path: ^1.9.1
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  printing: ^5.15.1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  timezone: ^0.11.2
  uuid: ^4.5.3
  image_picker: ^1.2.4
  firebase_storage: ^14.0.1

dev_dependencies:
  build_runner: ^2.16.2
  firebase_core_platform_interface: ^8.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  sqflite_common_ffi: ^2.4.5
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/icons/notification_bell.png
    - assets/images/default_avatar.png
    - assets/images/medication_3d.png
